name: Build MechWright

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MechWright.slnx
      - name: Build
        run: dotnet build MechWright.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test MechWright.slnx -c Release --no-build
