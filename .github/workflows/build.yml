name: Build MechWright

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mechwright-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore MechWright.slnx
      - name: Build
        run: dotnet build MechWright.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test MechWright.slnx -c Release --no-build
      - name: Publish Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'src/MechWright.App/MechWright.App.csproj'
          $output = 'artifacts/windows'
          dotnet publish $project -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Single-file publish failed.' }
          $oversized = @(Get-ChildItem $output -File -Recurse | Where-Object { $_.Length -ge 95MB })
          if ($oversized.Count -gt 0) {
            Write-Host 'Compressed all-in-one bundle too large for Git. Try native sidecars.'
            Remove-Item $output -Recurse -Force
            dotnet publish $project -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=false `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none `
              -o $output
            if ($LASTEXITCODE -ne 0) { throw 'Hybrid publish failed.' }
          }
          $oversized = @(Get-ChildItem $output -File -Recurse | Where-Object { $_.Length -ge 95MB })
          if ($oversized.Count -gt 0) {
            Write-Host 'Hybrid bundle still too large. Use self-contained multi-file output.'
            Remove-Item $output -Recurse -Force
            dotnet publish $project -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=false `
              -p:DebugType=none `
              -o $output
            if ($LASTEXITCODE -ne 0) { throw 'Multi-file publish failed.' }
          }
          # Runtime SDK packages occasionally include native debug symbols.
          Get-ChildItem $output -Recurse -File -Filter '*.pdb' | Remove-Item -Force
      - name: Windows UI workflow smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path 'artifacts/windows') 'MechWright.App.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--ui-smoke-test' -PassThru
          if (!$process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force
            throw 'The GUI smoke test did not finish within 45 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            $diagnostic = Join-Path (Resolve-Path 'artifacts/windows') 'ui-smoke-error.txt'
            if (Test-Path $diagnostic) {
              Write-Output 'UI smoke failure details:'
              Get-Content $diagnostic | Write-Output
            }
            throw "GUI smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Verify app bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $published = 'artifacts/windows'
          if (!(Test-Path (Join-Path $published 'MechWright.App.exe'))) {
            throw 'Published MechWright.App.exe was not found.'
          }
          $files = @(Get-ChildItem $published -Recurse -File)
          if ($files.Count -eq 0) { throw 'Publish directory is empty.' }
          if (@($files | Where-Object { $_.Length -ge 100MB }).Count -gt 0) {
            throw 'GitHub rejects files larger than 100 MiB.'
          }
          if (Test-Path app) { Remove-Item app -Recurse -Force }
          New-Item -ItemType Directory -Path app | Out-Null
          Copy-Item (Join-Path $published '*') -Destination app -Recurse -Force
          if (!(Test-Path 'app/MechWright.App.exe')) {
            throw 'The checked-in executable is missing.'
          }
      - name: Commit tested app files to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A -- app/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No changes in app/ to commit.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw 'Failed to compare app changes.' }
          # Another source change may have arrived while this runner compiled.
          # Never publish an older executable on top of newer source.
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect current main.' }
          $source = git rev-parse HEAD
          $remote = git rev-parse origin/main
          if ($source -ne $remote) {
            Write-Host 'main advanced during this build; a newer queued run will publish the current executable.'
            exit 0
          }
          git commit -m 'build: sync compiled MechWright app [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit app files.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            git fetch origin main
            Write-Host 'main moved after verification. A newer run will synchronize app/.'
            exit 0
          }
